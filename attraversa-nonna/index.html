<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6ec3f0" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Attraversa, Nonna!</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <div id="hud" hidden>
        <div class="hud-top">
          <button id="btn-pause" class="round-btn" type="button" aria-label="Pausa">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" /><rect x="14" y="5" width="4" height="14" rx="1.5" /></svg>
          </button>
          <div class="hud-meters">
            <div id="hud-meters" class="meters">0 m</div>
            <div id="hud-best" class="best"></div>
          </div>
          <div class="hud-stats">
            <div id="hud-hearts" class="hud-hearts"></div>
            <span id="hud-candies" class="chip chip-candy"></span>
          </div>
        </div>
        <div id="hud-coffee" class="coffee-meter" hidden><span></span></div>
        <button id="btn-slipper" class="slipper-btn" type="button" aria-label="Ciabatta">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <g transform="rotate(-28 32 34)">
              <path d="M32 58 C20 58 18 36 21 22 C23 10 41 10 43 22 C46 36 44 58 32 58 Z" fill="#f2d7b0" stroke="#2d2a3e" stroke-width="3.5" stroke-linejoin="round" />
              <path d="M19.5 30 Q32 23 44.5 30 L43.5 17 Q32 11 20.5 17 Z" fill="#3d8bd9" stroke="#2d2a3e" stroke-width="3" stroke-linejoin="round" />
              <path d="M22 25 Q32 19 42 25" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 3" />
            </g>
          </svg>
          <span id="slipper-count" class="badge"></span>
        </button>
        <div id="hint" class="hint" hidden></div>
      </div>

      <div id="layer"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
