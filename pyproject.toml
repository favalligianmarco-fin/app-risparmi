[project]
name = "sync-spese"
version = "0.1.0"
description = "Ingestione dei movimenti bancari da Enable Banking (PSD2 AIS) verso SQLite locale."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.8",
    "python-dotenv>=1.0",
]

[project.scripts]
sync-spese = "sync_spese.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_spese"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "UP017"]  # `timezone.utc` resta più esplicito di `datetime.UTC`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
